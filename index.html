<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1712" id="theme-color" />
    <meta
      name="description"
      content="Who is on the air, the Monday GB3YA net, repeater coverage, and the club diary for Cwmbran & District Amateur Radio Society."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CADARS Live" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <title>CADARS Live</title>
    <script>
      try {
        var saved = localStorage.getItem('cadars-theme')
        var theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.dataset.theme = theme
        var meta = document.getElementById('theme-color')
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#1c1712' : '#f3ecdf')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p>CADARS Live needs JavaScript so the on-air list can update.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
